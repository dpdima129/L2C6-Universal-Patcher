name: Build Windows Patcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Run tests
        run: python -m unittest discover -s src -p "test_*.py" -v

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name L2C6_Universal_Patcher
          --paths src
          src/patcher_gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: L2C6_Universal_Patcher-Windows
          path: dist/L2C6_Universal_Patcher.exe
          if-no-files-found: error
          retention-days: 14
